<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORE · Buy-Out Console — Tonopah THS Sports Complex</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Roboto+Slab:wght@500&display=swap" rel="stylesheet">
<style>
/* ── CORE Construction design tokens (Brand Guidelines rev. Oct 2023) ───────── */
:root{
  --core-green:#008348; --core-bright-green:#00AD68; --core-deep-green:#004E2B;
  --core-black:#000; --core-white:#fff;
  --core-asphalt:#282828; --core-cement:#BDBEC0; --core-concrete:#F2F3F3;
  --border-default:var(--core-cement); --border-strong:var(--core-asphalt);
  --status-success:var(--core-green); --status-danger:#B3261E; --status-warning:#8A6100;
  --font-display:'Archivo','Arial Narrow',Arial,Helvetica,sans-serif;
  --font-accent:'Roboto Slab',Georgia,serif;
  --font-body:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --radius-sm:4px; --shadow-md:0 2px 8px rgba(0,0,0,.10); --shadow-lg:0 8px 24px rgba(0,0,0,.14);
  /* theme slots, rewritten by applyTheme() */
  --bar:var(--core-black); --barFg:#fff; --barSub:var(--core-cement);
  --barEdge:var(--core-bright-green); --barAccent:var(--core-bright-green);
  --sect:var(--core-asphalt); --sectFg:#fff; --sectSub:var(--core-cement);
  --page:var(--core-concrete);
  --rowPad:11px 16px; --fs:13px; --kpiPad:14px 20px; --kpiNum:26px; --railW:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--page);font-family:var(--font-body);color:var(--core-black)}
a{color:var(--core-green);text-decoration:none} a:hover{text-decoration:underline}
input,button,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--core-cement)}
.wrap{min-height:100vh;display:flex;flex-direction:column;background:var(--page)}

/* top bar */
.bar{background:var(--bar);color:var(--barFg);padding:14px 28px;display:flex;align-items:center;gap:24px;border-bottom:1.5px solid var(--barEdge);flex-wrap:wrap}
.bar h1{font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0}
.bar .sub{font-size:12px;color:var(--barSub)}
.clock{display:flex;align-items:center;gap:10px;padding:6px 14px;border:1.5px solid var(--barEdge)}
.clock b{font-family:var(--font-display);font-weight:900;font-size:18px;color:var(--barAccent);line-height:1}
.clock span{font-size:11px;line-height:1.25;color:var(--barSub);text-transform:uppercase;letter-spacing:.08em}
.lbl{font-size:11px;color:var(--barSub);text-transform:uppercase;letter-spacing:.08em}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--core-cement);border-bottom:1px solid var(--core-cement)}
.kpi{background:#fff;padding:var(--kpiPad);display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--core-asphalt);font-weight:700;font-family:var(--font-display)}
.kpi .v{font-family:var(--font-display);font-weight:900;font-size:var(--kpiNum);line-height:1}
.kpi .s{font-size:11.5px;color:var(--core-asphalt)}

/* tabs */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--core-cement);padding:0 20px;flex-wrap:wrap}
.tab{padding:13px 18px;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--core-asphalt);border-bottom:3px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab[aria-selected="true"]{color:var(--core-black);border-bottom-color:var(--core-green)}
.tab:hover{opacity:.7}
.tab .n{margin-left:8px;font-size:11px;color:var(--core-cement)}

.main{flex:1;padding:24px 28px 64px}
.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.tglab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--core-asphalt);font-weight:700;font-family:var(--font-display)}
.chip{padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--border-strong);background:#fff;color:var(--core-asphalt);border-radius:var(--radius-sm)}
.chip[aria-pressed="true"]{background:var(--core-asphalt);color:#fff}
input[type=search],input[type=text]{padding:8px 12px;border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:13px;background:#fff}

/* table */
.grp{margin-bottom:26px;background:#fff;border:1px solid var(--border-default)}
.grph{display:flex;align-items:baseline;gap:14px;padding:12px 16px;background:var(--sect);color:var(--sectFg)}
.grph .t{font-family:var(--font-display);font-weight:900;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.grph .m{font-size:11.5px;color:var(--sectSub)}
.cols{grid-template-columns:92px minmax(210px,1fr) 148px 140px 180px 96px 84px 146px}
.hd,.row{display:grid;gap:0;padding:var(--rowPad);align-items:center}
.hd{border-bottom:1px solid var(--border-default);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--core-asphalt);font-family:var(--font-display)}
.row{border-bottom:1px solid var(--core-concrete);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit}
.row:hover{background:var(--core-concrete)}
.row .id{font-family:var(--font-display);font-weight:900;font-size:12.5px}
.row .ti{font-size:var(--fs);line-height:1.35}
.mut{font-size:11.5px;color:var(--core-asphalt)}
.rt{text-align:right;font-size:12.5px;font-weight:700}
.pill{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:3px;font-family:var(--font-display);display:inline-block}
.flag{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 5px;border-radius:3px;font-family:var(--font-display);flex:none}
.meter{height:4px;background:var(--core-cement)} .meter>i{display:block;height:4px}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;align-items:start}
.bcol{display:flex;flex-direction:column;gap:8px}
.bhd{background:var(--sect);color:var(--sectFg);padding:8px 10px;border-radius:4px 4px 0 0}
.bhd .n{font-family:var(--font-display);font-weight:900;font-size:12px;letter-spacing:.06em}
.bhd .l{font-size:10.5px;color:var(--sectSub);line-height:1.3}
.bcard{background:#fff;border:1px solid var(--border-default);border-left:var(--railW) solid var(--core-cement);padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit}
.bcard:hover{box-shadow:var(--shadow-md)}

/* leveling / ask */
.card{background:#fff;border:1px solid var(--border-default);margin-bottom:14px}
.cardh{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--core-concrete)}
.cardb{padding:13px 16px;font-size:13.5px;line-height:1.55;color:var(--core-asphalt)}
.cite{background:var(--core-concrete);border-left:3px solid var(--core-green);padding:9px 13px;margin:8px 0;font-size:12.5px;line-height:1.5}
.cite b{font-family:var(--font-display);font-size:11px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:3px;color:var(--core-deep-green)}
h2.sec{font-family:var(--font-display);font-weight:900;font-size:20px;margin:0 0 4px}
p.secsub{font-size:13px;color:var(--core-asphalt);max-width:820px;margin:0 0 16px;line-height:1.55}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;z-index:40}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,94vw);background:#fff;box-shadow:var(--shadow-lg);z-index:50;display:none;flex-direction:column}
.drawer.on{display:flex}
.dh{background:var(--sect);color:var(--sectFg);padding:16px 20px;display:flex;align-items:flex-start;gap:14px}
.dh .id{font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:.05em}
.db{overflow:auto;padding:18px 20px;flex:1}
.dsec{font-family:var(--font-display);font-weight:900;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--core-asphalt);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--core-cement)}
.dsec:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px;line-height:1.5}
.kv dt{color:var(--core-asphalt)} .kv dd{margin:0;font-weight:600}
ul.tight{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
ul.tight li{margin-bottom:5px}
.x{margin-left:auto;background:none;border:1.5px solid currentColor;color:inherit;font-size:12px;font-weight:700;padding:5px 11px;cursor:pointer;border-radius:var(--radius-sm)}
.feel{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:9px 28px;background:#fff;border-bottom:1px solid var(--core-cement);font-size:12px}
.feel select{padding:5px 9px;border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--core-asphalt);font-size:14px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:80px 1fr 120px}
  .hd>*:nth-child(n+4),.row>*:nth-child(n+4){display:none}}
</style>
</head>

halt Paving in primary_specifications, plus Division 31 Earthwork and Division 33 Utilities in primary_divisions. The package flagged here is ITB-008"]]},{"kind":"GAP","sev":"high","title":"'070 Final Cleaning' has four proposals but no package in the project package list","src":"proposal-inventory","pkgs":[],"detail":"Proposals from CSI, Lady Lux, and Nevada Angels (plus a Nevada Angels descope) are filed under number 070 'Final Cleaning'. Neither the 1% list nor the ITB list in CLAUDE.md contains a Final Cleaning package.","cites":[["why_it_matters","Either the 33-package list is incomplete, or final cleaning is being self-performed by CORE. Final cleaning is commonly assumed by every trade to be someone else's -- if it is neither a package nor an explicit CORE scope, it is an uncovered cost."],["pm_action","Confirm whether Final Cleaning is a 34th package, a CORE general-conditions scope, or folded into another package."]]},{"kind":"GAP","sev":"high","title":"Prevailing wage \u2014 Clark County vs Nye County","src":"supersession-map","pkgs":["ALL 33"],"detail":"Clarification No. 2 text says to use CLARK COUNTY prevailing wage rates. CLAUDE.md records the project as Southern Nevada RURAL Region, and the project is in Nye County, not Clark County. Verify which rate schedule governs before any subcontract is issued -- this is a direct cost and compliance exposure on all 33 packages.","cites":[["Clarification No. 2","Project subject to prevailing wage rates (CL-2026-100). Refer to NV Labor Commissioner website for current rates. Current prevailing wage rates must be included in bid."]]},{"kind":"OVL","sev":"medium","title":"17 drawing candidates sit on sheets Addendum #1 superseded","src":"package-index-v2","pkgs":["ITB-018","ITB-062","ITB-071","ITB-074","ITB-077","ITB-089","RFP-008","RFP-021","RFP-022","RFP-030","RFP-045","RFP-060","RFP-094","RFP-109"],"detail":"The base-bid vision pass associated 148 sheets with packages. 17 of those associations point at sheets reissued by Addendum #1: ITB-018 -> A1-20; ITB-062 -> A2-10; ITB-071 -> A10-30; ITB-074 -> LS1-10; ITB-077 -> A10-30; ITB-089 -> G0-00, A1-20; RFP-008 -> C1, GD; RFP-021 -> GD; RFP-022 -> GD; RFP-030 -> A1-20; RFP-045 -> LS1-10; RFP-060 -> A2-10; RFP-094 -> G0-00, A1-20; RFP-109 -> A1-20","cites":[["why_it_matters","Sheet content read from a superseded revision is not reliable. Each is carried as a CANDIDATE with an explicit WARNING and must be re-read at the current revision before it informs an exhibit."],["pm_action","None -- handled in the drafting stage, but do not let a draft cite these unchecked."]]},{"kind":"OVL","sev":"medium","title":"'065 Sealed Concrete' overlaps ITB-066 and ITB-067 with the same bidders","src":"proposal-inventory","pkgs":[],"detail":"SI Legacy's sealed-concrete descope is filed under 065, while the same scope also appears under 066 (Sealed Concrete), 067 (Fluid Applied Floor) and combined '066, 067' filenames from NRC, Ryerson and FW Specialties. ITB-066 is Fluid-Applied Flooring and ITB-067 is Concrete Finishing.","cites":[["why_it_matters","ITB-066 and ITB-067 currently show the identical four bidders. The boundary between fluid-applied flooring, sealed concrete and concrete finishing is not established by the numbering, and ITB-066 has no spec section in the manual."],["pm_action","Rule on which package carries sealed concrete before either exhibit is drafted."]]},{"kind":"OVL","sev":"medium","title":"Bidders priced across package boundaries -- relevant to planned package combinations","src":"proposal-inventory","pkgs":[],"detail":"Combined proposals on file: '016, 022' (Sprinturf, irrigation + synthetic turf), '040, 044' (Gleeson Powers, sealants + insulation), '066, 067' (NRC, Ryerson, FW Specialties), '072, 089' (Image360, Y C Signs, signage + scoreboards).","cites":[["why_it_matters","These are the seams where the market itself combines scope. Worth weighing against the package combinations the PM intends, since a combination the b const S = {view:'packages', group:'source', layout:'table', filter:'', sel:null,
           density:'Standard', chrome:'Field green', risk:'Standard', query:'', thread:[]};

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => n==null ? '—' : '$'+Math.round(n/1000).toLocaleString()+'K';

function applyTheme(){
  const r=document.documentElement.style;
  const d=THEME.density[S.density]; Object.entries(d).forEach(([k,v])=>r.setProperty('--'+k,v));
  const c=THEME.chrome[S.chrome];   Object.entries(c).forEach(([k,v])=>r.setProperty('--'+k,v));
  r.setProperty('--railW',THEME.risk[S.risk]);
}
const hot = p => p.flags.length>0 || p.procflags.length>0;
const tint = p => (S.risk==='Alarm' && hot(p)) ? '#FFF6F4' : 'transparent';

function match(p){
  const f=S.filter.trim().toLowerCase(); if(!f) return true;
  return (p.id+' '+p.title+' '+(p.sub||'')+' '+p.divName+' '+p.specs.join(' ')+' '+p.bidders.join(' ')).toLowerCase().includes(f);
}
const shown = ()=>DATA.packages.filter(match);

function statusPill(p){
  const s=String(p.status||'').toLowerCase();
  if(s==='awarded') return {t:'Awarded',bg:'#E6F4EC',fg:'#004E2B'};
  // awarded-sub-mapping writes free text ("NOT YET AWARDED as of …"), so match loosely.
  if(s.includes('not yet awarded')||s==='not-yet-awarded') return {t:'Not yet awarded',bg:'#FFF4DB',fg:'#8A6100'};
  return {t:p.source==='ITB'?'ITB — no award tracked':'No award on file',
          bg:'var(--core-concrete)',fg:'var(--core-asphalt)'};
}

/* ── KPIs ─────────────────────────────────────────────────────────────────── */
function renderKpis(){
  const all=DATA.packages;
  const awarded=all.filter(p=>p.status==='awarded');
  const committed=awarded.reduce((a,p)=>a+(p.price||0),0);
  const nospec=all.filter(p=>p.flags.includes('NOSPEC')).length;
  const rev=all.filter(p=>p.flags.includes('REV')).length;
  const proc=all.reduce((a,p)=>a+p.procflags.length,0);
  const open=DATA.leveling.filter(l=>l.sev==='high'||l.sev==='HIGH').length;
  const k=[
    ['Packages',all.length,'16 RFP (1%) · 17 ITB','var(--core-black)'],
    ['Awarded',awarded.length+' / 16',money(committed)+' committed','var(--core-green)'],
    ['Open high-severity',open,'in the leveling register',open?'var(--status-danger)':'var(--core-green)'],
    ['No spec source',nospec,'packages with no primary spec',nospec?'var(--status-danger)':'var(--core-green)'],
    ['Procurement flags',proc,rev+' pkgs cite superseded sheets','var(--status-warning)']
  ];
  $('#kpis').innerHTML=k.map(([l,v,s,c])=>
    `<div class="kpi"><div class="k">${esc(l)}</div><div class="v" style="color:${c}">${esc(v)}</div><div class="s">${esc(s)}</div></div>`).join('');
}

function renderTabs(){
  const t=[['packages','Packages',DATA.packages.length],
           ['specs','Spec coverage',DATA.specCoverage.length],
           ['leveling','Leveling register',DATA.leveling.length],
           ['ask','Ask the bid set','']];
  $('#tabs').innerHTML=t.map(([k,l,n])=>
    `<button class="tab" role="tab" aria-selected="${S.view===k}" data-tab="${k}">${esc(l)}<span class="n">${n}</span></button>`).join('');
}

/* ── Packages ─────────────────────────────────────────────────────────────── */
function groups(){
  const rows=shown();
  if(S.group==='source'){
    return [['RFP','1% List (NRS 338.16995) — RFP packages'],['ITB','Non-1% List — ITB packages']]
      .map(([k,label])=>({label,rows:rows.filter(p=>p.source===k)})).filter(g=>g.rows.length);
  }
  if(S.group==='division'){
    const seen=[...new Set(rows.map(p=>p.div))].sort();
    return seen.map(d=>({label:'Division '+d+' — '+(rows.find(p=>p.div===d)||{}).divName,
                         rows:rows.filter(p=>p.div===d)}));
  }
  return [{label:'All packages',rows}];
}

function rowHtml(p){
  const st=statusPill(p);
  const flags=p.flags.map(f=>`<span class="flag" title="${esc(FLAGMETA[f].title)}" style="background:${FLAGMETA[f].bg};color:${FLAGMETA[f].fg}">${f}</span>`).join('');
  const pct=Math.min(100,Math.round((p.scopeItems/135)*100));
  return `<button class="row cols" data-open="${esc(p.id)}" style="background:${tint(p)}">
    <div class="id">${esc(p.id)}</div>
    <div style="display:flex;align-items:center;gap:8px;padding-right:14px;flex-wrap:wrap">
      <span class="ti">${esc(p.title)}</span>${flags}</div>
    <div class="mut">Div ${esc(p.div)} · ${esc(p.divName)}</div>
    <div style="padding-right:16px">
      <div class="mut" style="margin-bottom:4px">${p.scopeItems} scope items</div>
      <div class="meter"><i style="width:${pct}%;background:var(--core-green)"></i></div></div>
    <div style="font-size:12.5px;color:${p.sub?'var(--core-black)':'var(--core-cement)'}">${esc(p.sub||'— not awarded')}</div>
    <div class="rt">${money(p.price)}</div>
    <div class="rt" style="font-weight:600;color:var(--core-asphalt);padding-right:14px">${p.bidderCount} bid${p.bidderCount===1?'':'s'}</div>
    <div><span class="pill" style="background:${st.bg};color:${st.fg}">${esc(st.t)}</span></div>
  </button>`;
}

function viewPackages(){
  const gs=groups();
  const controls=`<div class="toolbar">
    <div style="display:flex;align-items:center;gap:8px"><span class="tglab">Group</span>
      ${[['source','Bid list'],['division','CSI division'],['none','Flat']].map(([k,l])=>
        `<button class="chip" data-group="${k}" aria-pressed="${S.group===k}">${l}</button>`).join('')}</div>
    <div style="display:flex;align-items:center;gap:8px"><span class="tglab">View</span>
      ${[['table','Table'],['board','Board']].map(([k,l])=>
        `<button class="chip" data-layout="${k}" aria-pressed="${S.layout===k}">${l}</button>`).join('')}</div>
    <div style="flex:1"></div>
    <input type="search" id="filter" value="${esc(S.filter)}" placeholder="Filter packages, subs, spec sections…" style="width:320px">
  </div>`;

  if(!shown().length) return controls+`<div class="empty">No packages match “${esc(S.filter)}”.</div>`;

  if(S.layout==='board'){
    const cols=gs.map(g=>`<div class="bcol">
      <div class="bhd"><div class="n">${esc(g.label.split('—')[0].trim())}</div>
        <div class="l">${g.rows.length} packages</div></div>
      ${g.rows.map(p=>`<button class="bcard" data-open="${esc(p.id)}"
         style="border-left-color:${p.status==='awarded'?'var(--core-green)':'var(--core-cement)'};background:${tint(p)}">
        <div style="font-family:var(--font-display);font-weight:900;font-size:11.5px">${esc(p.id)}</div>
        <div style="font-size:11.5px;line-height:1.3;color:var(--core-asphalt)">${esc(p.title.slice(0,60))}</div>
        <div style="font-size:11px;font-weight:700">${money(p.price)}</div></button>`).join('')}
    </div>`).join('');
    return controls+`<div class="board">${cols}</div>`;
  }

  return controls+gs.map(g=>{
    const val=g.rows.reduce((a,p)=>a+(p.price||0),0);
    return `<section class="grp">
      <div class="grph"><div class="t">${esc(g.label)}</div>
        <div class="m">${g.rows.length} packages · ${money(val)} awarded value</div></div>
      <div class="hd cols"><div>Package</div><div>Scope</div><div>CSI Div</div><div>Scope items</div>
        <div>Subcontractor</div><div class="rt">Value</div><div class="rt" style="padding-right:14px">Bidders</div><div>Award</div></div>
      ${g.rows.map(rowHtml).join('')}
    </section>`;
  }).join('');
}

/* ── Ask ──────────────────────────────────────────────────────────────────── */
function answerFor(q){
  const lq=q.toLowerCase();
  const ps=DATA.packages.filter(p=>(p.id+' '+p.title+' '+(p.sub||'')+' '+p.specs.join(' ')+' '+p.coord.join(' ')).toLowerCase().includes(lq));
  const lv=DATA.leveling.filter(l=>(l.title+' '+l.detail+' '+l.pkgs.join(' ')).toLowerCase().includes(lq));
  const coord=[];
  DATA.packages.forEach(p=>p.coord.forEach(c=>{ if(c.toLowerCase().includes(lq)) coord.push([p.id,c]); }));
  return {ps:ps.slice(0,8),lv:lv.slice(0,4),coord:coord.slice(0,8)};
}

    const r=t.res;
    return `<article class="card">
      <div class="cardh"><div style="flex:1"><div style="font-family:var(--font-display);font-weight:900;font-size:14.5px">${esc(t.q)}</div></div></div>
      <div class="cardb">
        ${r.coord.length?`<div class="dsec" style="margin-top:0">Coordination clauses that name it (${r.coord.length})</div>
          ${r.coord.map(([id,c])=>`<div class="cite"><b>${esc(id)}</b>${esc(c)}</div>`).join('')}`:''}
        ${r.ps.length?`<div class="dsec">Packages (${r.ps.length})</div><ul class="tight">
          ${r.ps.map(p=>`<li><b>${esc(p.id)}</b> — ${esc(p.title)} · ${esc(p.sub||'not awarded')} · ${p.bidderCount} bids</li>`).join('')}</ul>`:''}
        ${r.lv.length?`<div class="dsec">Leveling register</div><ul class="tight">
          ${r.lv.map(l=>`<li><b>${esc(l.sev)}</b> — ${esc(l.title)}</li>`).join('')}</ul>`:''}
        ${(!r.coord.length&&!r.ps.length&&!r.lv.length)?'<em>Nothing in the indexed bid set matches that. Try a scope noun (footings, curb, salvage, membrane), a package id, or a spec section number.</em>':''}
      </div></article>`;
  }).join('')}`;
}

/* ── Drawer ───────────────────────────────────────────────────────────────── */
function renderDrawer(){
  const d=$('#drawer'), sc=$('#scrim');
  if(!S.sel){ d.classList.remove('on'); sc.classList.remove('on'); d.innerHTML=''; return; }
  const p=DATA.packages.find(x=>x.id===S.sel); if(!p) return;
  const st=statusPill(p);
  d.classList.add('on'); sc.classList.add('on');
  d.innerHTML=`
    <div class="dh"><div><div class="id">${esc(p.id)}</div>
      <div style="font-size:13px;margin-top:2px">${esc(p.title)}</div></div>
      <button class="x" id="close">Close</button></div>
    <div class="db">
      <div class="dsec">Award</div>
      <dl class="kv">
        <dt>Status</dt><dd><span class="pill" style="background:${st.bg};color:${st.fg}">${esc(st.t)}</span></dd>
        <dt>Awarded sub</dt><dd>${esc(p.sub||'— not awarded')}</dd>
        <dt>Proposal value</dt><dd>${money(p.price)}</dd>
        <dt>Bidders on file</dt><dd>${p.bidderCount} — ${esc(p.bidders.join(', ')||'none')}</dd>
      </dl>
      ${p.procflags.length?`<div class="dsec">Procurement flags</div><ul class="tight">
        ${p.procflags.map(f=>`<li style="color:var(--status-danger)">${esc(PROCLABEL[f]||f)}</li>`).join('')}</ul>`:''}
      ${p.awardNotes.length?`<div class="dsec">Award notes</div>
        ${p.awardNotes.map(n=>`<div class="cite">${esc(n)}</div>`).join('')}`:''}
      ${p.rulings.length?`<div class="dsec">PM rulings applied</div>
        ${p.rulings.map(r=>`<div class="cite" style="border-left-color:var(--core-deep-green)">${esc(r)}</div>`).join('')}`:''}
      <div class="dsec">Primary specifications</div>
      ${p.specs.length?`<ul class="tight">${p.specs.map(s=>{const[n,t]=s.split('|');
        return `<li><b>${esc(n)}</b> — ${esc(t)}</li>`}).join('')}</ul>`
        :'<div class="cite" style="border-left-color:var(--status-danger)">No primary specification cited by the scope narrative, and none matched in the spec manual. Execution standard undecided.</div>'}
      <div class="dsec">Coordination clauses (${p.coordCount})</div>
      ${p.coord.length?`<ul class="tight">${p.coord.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:'<em>None.</em>'}
      <div class="dsec">Drawings</div>
      <dl class="kv"><dt>Cited by scope doc</dt><dd>${esc(p.sheets.join(', ')||'—')}</dd></dl>
      ${p.candidates.length?`<div class="mut" style="margin-top:8px">Candidates (not corroborated by the scope narrative):</div>
        <ul class="tight">${p.candidates.map(c=>`<li>${esc(c.n)} — ${esc(c.t||'')}${c.warn?' <span class="flag" style="background:#FFF4DB;color:#8A6100">SUPERSEDED — RE-READ</span>':''}</li>`).join('')}</ul>`:''}
      <div class="dsec">Scope narrative</div>
      <dl class="kv"><dt>Scope items</dt><dd>${p.scopeItems} (verbatim)</dd>
        <dt>Alternates</dt><dd>${p.alts}</dd></dl>
    </div>`;
  $('#close').onclick=()=>{S.sel=null;renderDrawer();};
}

/* ── Render / events ──────────────────────────────────────────────────────── */
function render(){
  applyTheme();
  renderKpis(); renderTabs();
  $('#main').innerHTML = S.view==='packages'?viewPackages()
    : S.view==='specs'?viewSpecs()
    : S.view==='leveling'?viewLeveling() : viewAsk();
  renderDrawer();
  const f=$('#filter'); if(f){ f.oninput=e=>{S.filter=e.target.value; const p=e.target.selectionStart;
    render(); const n=$('#filter'); if(n){n.focus(); n.setSelectionRange(p,p);} }; }
  const q=$('#q');
  if(q){ const go=()=>{ const v=$('#q').value.trim(); if(!v) return;
      S.thread=[{q:v,res:answerFor(v)}].concat(S.thread); S.query=''; render(); };
    $('#askgo').onclick=go; q.onkeydown=e=>{if(e.key==='Enter')go();}; }
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-group],[data-layout],[data-open],[data-cite]');
  if(!t) return;
  if(t.dataset.tab){S.view=t.dataset.tab; S.cite=null;}
  else if(t.dataset.group)S.group=t.dataset.group;
  else if(t.dataset.layout)S.layout=t.dataset.layout;
  else if(t.dataset.open)S.sel=t.dataset.open;
  else if(t.dataset.cite!=null)S.cite = S.cite===+t.dataset.cite ? null : +t.dataset.cite;
  render();
});
$('#scrim').onclick=()=>{S.sel=null;renderDrawer();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sel){S.sel=null;renderDrawer();}});
['density','chrome','risk'].forEach(k=>{ $('#'+k).onchange=e=>{S[k]=e.target.value;render();}; });

$('#projline').textContent=`${DATA.meta.project} · ${DATA.meta.owner} · ${DATA.meta.delivery}`;
$('#bidset').innerHTML=esc(DATA.meta.bidSet);
$('#provenance').textContent=`${DATA.meta.totals.scope_items_captured.toLocaleString()} verbatim scope items · `
  +`${DATA.meta.totals.coordination_clauses} coordination clauses · `
  +`${DATA.meta.coverage.NOT_PROCESSED} source files still unopened`;
render();
</script>
</body>
</html>
